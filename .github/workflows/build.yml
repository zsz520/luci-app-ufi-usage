name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build apk
        run: sh ./build_apk.sh

      - name: Run backend self-test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            alpine:edge \
            /bin/sh -lc 'apk add --no-cache python3 openssl >/dev/null && python3 root/usr/bin/ufi-usage selftest'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-ufi-usage
          path: |
            outputs/*.apk
            outputs/*.apk.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path=$(find outputs -maxdepth 1 -name '*.apk' -print -quit)
          sha_path="${apk_path}.sha256"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$apk_path" "$sha_path" --clobber
